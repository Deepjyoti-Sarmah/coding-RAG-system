name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv run ruff check .

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv build
      # Installing the built wheel from outside the checkout is what proves the
      # packaging config is right: running from the repo root would let the
      # working directory satisfy imports that the wheel does not ship.
      - name: Install the wheel and run it from another directory
        run: |
          uv tool install --force dist/*.whl
          cd "$RUNNER_TEMP"
          ckg --help
          ckg init
          test -f .mcp.json

  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
      # macOS ships SQLite without loadable-extension support, so sqlite-vec
      # cannot load. The project has a documented fallback
      # (retrieval/numpy_vector_store.py via storage/db.py::load_vec_extension
      # returning False). Do not shim sqlite-vec on macOS; let the fallback
      # engage. The macOS matrix cells exist to prove the fallback works.
      - run: uv run pytest
