[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "code-knowledge-graph"
version = "0.1.0"
description = "Local-first code intelligence engine with hybrid retrieval and MCP server"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    "mcp>=2.0.0",
    "numpy>=2.0",
    "pathspec>=1.1.1",
    "sqlite-vec>=0.1.9",
    "tiktoken>=0.14",
    "tree-sitter>=0.25.2",
    "tree-sitter-c-sharp>=0.23.5",
    "tree-sitter-c==0.24.1",
    "tree-sitter-cpp==0.23.4",
    "tree-sitter-go>=0.25.0",
    "tree-sitter-java==0.23.5",
    "tree-sitter-python>=0.25.0",
    "tree-sitter-rust>=0.24.2",
    "tree-sitter-typescript>=0.23.2",
    "watchdog>=6.0",
]

[project.optional-dependencies]
local = ["sentence-transformers>=3.0"]

[project.scripts]
ckg = "ckg.cli:main"
ckg-mcp = "ckg.mcp_server:main"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-cov>=7.0",
]

[tool.hatch.build.targets.wheel]
packages = [
    "analysis",
    "chunking",
    "ckg",
    "embeddings",
    "evaluation",
    "graph",
    "indexing",
    "ingestion",
    "models",
    "parsing",
    "retrieval",
    "storage",
    "session_memory",
]

[tool.hatch.build.targets.sdist]
exclude = [
    ".opencode",
    ".claude",
    ".venv",
    ".ruff_cache",
    "build",
    "dist",
    "code-context-engine",
    "tests",
    "test_repo",
    "specs",
    "benchmarks",
    "docs",
]

[tool.ruff]
exclude = ["code-context-engine", "tests/fixtures", ".venv"]

[tool.coverage.run]
source = ["analysis", "chunking", "ckg", "embeddings", "evaluation", "graph", "indexing", "ingestion", "models", "parsing", "retrieval", "storage", "session_memory"]
omit = ["tests/*", "code-context-engine/*", "*/__pycache__/*", "ckg/dashboard/app.py"]
branch = true

[tool.coverage.report]
skip_covered = false
show_missing = true
fail_under = 80

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = ["code-context-engine", ".venv", "test_repo"]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
]
