[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "code-knowledge-graph"
version = "0.1.0"
description = "Local-first code intelligence engine with hybrid retrieval and MCP server"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "mcp>=2.0.0",
    "numpy>=2.0",
    "pathspec>=1.1.1",
    "sqlite-vec>=0.1.9",
    "tiktoken>=0.14",
    "tree-sitter>=0.25.2",
    "tree-sitter-go>=0.25.0",
    "tree-sitter-java==0.23.5",
    "tree-sitter-python>=0.25.0",
    "tree-sitter-typescript>=0.23.2",
    "watchdog>=6.0",
]

[project.optional-dependencies]
local = ["sentence-transformers>=3.0"]

[project.scripts]
ckg = "ckg.cli:main"
ckg-mcp = "ckg.mcp_server:main"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.hatch.build.targets.wheel]
packages = [
    "analysis",
    "chunking",
    "ckg",
    "embeddings",
    "evaluation",
    "graph",
    "indexing",
    "ingestion",
    "models",
    "parsing",
    "retrieval",
    "storage",
]

[tool.hatch.build.targets.sdist]
exclude = [
    ".opencode",
    ".claude",
    ".venv",
    ".ruff_cache",
    "build",
    "dist",
    "code-context-engine",
    "tests",
    "test_repo",
    "specs",
    "benchmarks",
    "docs",
]

[tool.ruff]
exclude = ["code-context-engine", "tests/fixtures", ".venv"]

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = ["code-context-engine", ".venv", "test_repo"]
