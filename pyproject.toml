[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "code-knowledge-graph"
version = "0.1.0"
description = "Local-first code intelligence engine with hybrid retrieval and MCP server"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Deepjyoti Sarmah", email = "deepjyoti-sarmah@users.noreply.github.com" },
]
keywords = [
    "mcp",
    "rag",
    "code-search",
    "tree-sitter",
    "knowledge-graph",
    "llm",
    "code-intelligence",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Software Development :: Documentation",
    "Typing :: Typed",
]
dependencies = [
    "mcp>=2.0.0",
    "numpy>=2.0",
    "pathspec>=1.1.1",
    "sqlite-vec>=0.1.9",
    "tiktoken>=0.14",
    "tree-sitter>=0.25.2",
    "tree-sitter-c-sharp>=0.23.5",
    "tree-sitter-c==0.24.1",
    "tree-sitter-cpp==0.23.4",
    "tree-sitter-go>=0.25.0",
    "tree-sitter-java==0.23.5",
    "tree-sitter-python>=0.25.0",
    "tree-sitter-rust>=0.24.2",
    "tree-sitter-typescript>=0.23.2",
    "watchdog>=6.0",
]

[project.optional-dependencies]
local = ["sentence-transformers>=3.0"]

[project.urls]
Homepage = "https://github.com/Deepjyoti-Sarmah/coding-RAG-system"
Repository = "https://github.com/Deepjyoti-Sarmah/coding-RAG-system"
Issues = "https://github.com/Deepjyoti-Sarmah/coding-RAG-system/issues"
Changelog = "https://github.com/Deepjyoti-Sarmah/coding-RAG-system/blob/main/CHANGELOG.md"

[project.scripts]
ckg = "ckg.cli:main"
ckg-mcp = "ckg.mcp_server:main"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-cov>=7.0",
    "ruff>=0.13",
    # tests/test_secrets_fuzz.py's TestHypothesisFuzz (500 examples) was
    # silently skipped everywhere — including CI — because hypothesis was
    # never declared here, only pip-installed by hand in a local venv.
    "hypothesis>=6.100",
]

[tool.hatch.build.targets.wheel]
packages = [
    "analysis",
    "chunking",
    "ckg",
    "embeddings",
    "evaluation",
    "graph",
    "indexing",
    "ingestion",
    "models",
    "parsing",
    "retrieval",
    "storage",
    "session_memory",
]

[tool.hatch.build.targets.sdist]
exclude = [
    ".opencode",
    ".claude",
    ".venv",
    ".ruff_cache",
    "build",
    "dist",
    "code-context-engine",
    "tests",
    "test_repo",
    "specs",
    "benchmarks",
    "docs",
]

[tool.ruff]
exclude = ["code-context-engine", "tests/fixtures", ".venv"]

[tool.ruff.lint]
# ruff 0.13+ defaults to a much broader rule set than this codebase has ever
# been linted against (this repo had never run ruff before P6-2). The
# mechanical findings (import sort, unused imports, dead locals) were fixed
# directly. These four are left selected-out rather than fixed blind, because
# fixing them means editing exception-handling / resource-lifecycle control
# flow in indexing/, retrieval/, and analysis/ — real code review, not a
# lint pass. Tracked as a follow-up in CKG_CCE_PARITY_PLAN.md P6-2.
ignore = [
    "BLE001", # blind `except Exception` — used deliberately for best-effort,
              # non-fatal side operations (git hooks, resource-governor probes,
              # dashboard reindex/DELETE handlers, reranker weight loading).
    "S110",   # `try/except/pass` — same call sites as BLE001, same rationale.
    "SIM102", # nested `if` in indexing/secrets.py — flatten needs a read of
              # the secret-detection logic, not a blind restructure.
    "SIM103", # "return the condition directly" in analysis/semantic/ and
              # indexing/secrets.py — same, worth a real look not an autofix.
    "SIM115", # indexing/resource_governor.py:73 opens a file without a
              # context manager — possibly a real fd-lifecycle issue, flagged
              # for review rather than silently wrapped.
    "ASYNC220", # ckg/dashboard/app.py's async reindex handler calls
                # subprocess.Popen (non-blocking, fire-and-forget — it does
                # not wait()) inside `async def`; ruff flags process creation
                # itself as a blocking risk. Left as-is pending a decision on
                # whether to move to asyncio.create_subprocess_exec.
]

[tool.coverage.run]
source = ["analysis", "chunking", "ckg", "embeddings", "evaluation", "graph", "indexing", "ingestion", "models", "parsing", "retrieval", "storage", "session_memory"]
omit = ["tests/*", "code-context-engine/*", "*/__pycache__/*", "ckg/dashboard/app.py"]
branch = true

[tool.coverage.report]
skip_covered = false
show_missing = true
fail_under = 80

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = ["code-context-engine", ".venv", "test_repo"]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
]
